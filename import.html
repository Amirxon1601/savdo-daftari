<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savdo Daftari — import</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>body{font:15px system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#14243a}input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #cbd4dd}button{background:#1e4e9c;color:#fff;border-color:#1e4e9c;cursor:pointer}pre{background:#f4f7f9;padding:12px;border-radius:8px;white-space:pre-wrap}</style>
</head><body>
<h2>Eski daftardan ma'lumot ko'chirish</h2>
<p>Bu sahifa bir martalik. <code>import.enc</code> faylini o'qib, Firestore bazasiga yozadi.</p>
<p><input id="pass" type="password" placeholder="Shifr kaliti" style="width:100%"></p>
<p><button id="go">Import qilish</button></p>
<pre id="log"></pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+'\n'};
function pbkdf(pass,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']).then(k=>crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,384))}
document.getElementById('go').onclick=async()=>{
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.firestore();
    const buf=new Uint8Array(await (await fetch('import.enc',{cache:'no-store'})).arrayBuffer());
    if(new TextDecoder().decode(buf.slice(0,8))!=='Salted__')throw new Error('Fayl formati noto\'g\'ri');
    const salt=buf.slice(8,16),data=buf.slice(16);
    const bits=new Uint8Array(await pbkdf(document.getElementById('pass').value.trim(),salt));
    const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,data);
    const all=JSON.parse(new TextDecoder().decode(plain));
    let total=0;
    for(const col of Object.keys(all)){
      const docs=Object.entries(all[col]);let n=0;
      for(let i=0;i<docs.length;i+=400){
        const b=db.batch();
        for(const [id,doc] of docs.slice(i,i+400)){b.set(db.collection(col).doc(id),doc);n++}
        await b.commit();
      }
      log(col+': '+n+' ta yozildi');total+=n;
    }
    log('Tayyor. Jami '+total+' ta hujjat.');
  }catch(e){log('Xato: '+e.message)}
};
</script>
</body></html>
